name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - feature/github-pages-deployment
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            uv \
            marimo==0.24.2 \
            polars==1.44.2 \
            pyarrow \
            altair==6.3.0 \
            numpy==2.5.3 \
            shapely==2.1.2 \
            httpx==0.28.1 \
            anywidget==0.11.0

      - name: Prepare browser assets
        run: python scripts/build_pages_assets.py

      - name: Validate notebook
        run: python -m marimo check script.py

      - name: Export interactive WASM app
        run: >-
          python -m marimo export html-wasm script.py
          -o dist
          --mode run
          --execute
          --no-sandbox

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
