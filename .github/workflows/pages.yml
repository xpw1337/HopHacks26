name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      # Runs the notebook in normal Python and embeds every chart and map.
      # A WebAssembly export would reinstall packages the graphs were not
      # pinned against, which is what blanks them.
      - name: Export static notebook
        run: >-
          uvx --from marimo==0.24.2 marimo export html
          --sandbox --no-include-code --force
          script.py -o dist/index.html

      - name: Keep GitHub Pages from rewriting asset paths
        run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
